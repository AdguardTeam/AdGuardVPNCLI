name: Update install.sh
on:
  release:
    types: [published, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Run script
        run: |
          set -e -x
          git fetch origin master --tags
          git checkout -B master origin/master
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com>"
          git config user.name "github-actions[bot]"

          # List releases newest-first, dropping drafts and the auto-created
          # "Latest <channel>" mirror releases, so install.sh is only ever
          # synced from real releases and never from a "latest" mirror.
          gh release list --limit 200 --json tagName,name,createdAt,isDraft \
            --jq 'map(select((.isDraft | not) and ((.name // "") | startswith("Latest") | not)))
                  | sort_by(.createdAt) | reverse | .[].tagName' > tags.txt

          # Pick the newest real tag that belongs to the given channel.
          # rc releases are served through the beta channel. Stable releases
          # are served through both the release and the beta channels.
          pick_tag() {
            channel="$1"
            while IFS= read -r tag; do
              case "$tag" in
                *nightly*)   tag_channels='nightly' ;;
                *beta*|*rc*) tag_channels='beta' ;;
                *)           tag_channels='release beta' ;;
              esac
              for tag_channel in $tag_channels; do
                if [ "$tag_channel" = "$channel" ]; then
                  printf '%s' "$tag"
                  return 0
                fi
              done
            done < tags.txt
          }

          for channel in nightly beta release; do
            case "${channel}" in
              release) BADGE_COLOR='blue' ;;
              nightly) BADGE_COLOR='8B5CF6' ;;
              *)       BADGE_COLOR='orange' ;;
            esac
            TAG_NAME="$(pick_tag "$channel")"
            if [ -n "${TAG_NAME}" ]; then
              gh release download "${TAG_NAME}" \
                --pattern install.sh \
                --dir "scripts/${channel}" \
                --clobber
              # A stable release install.sh can be served through the beta
              # channel, so set the channel to the one it is served through.
              sed -i "s/^channel='[a-z]*'$/channel='${channel}'/" "scripts/${channel}/install.sh"
              printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' \
                "${channel}" "${TAG_NAME}" "${BADGE_COLOR}" > "scripts/${channel}/badge.json"
              git add "scripts/${channel}/install.sh" "scripts/${channel}/badge.json"
            fi
          done

          if ! git diff-index --cached --quiet HEAD; then
            git commit -m "Update install.sh and badge.json"
            git push origin HEAD
          fi
